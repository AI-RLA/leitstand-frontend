services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: leitstand-frontend:local
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
      NGINX_ENVSUBST_FILTER: "^BACKEND_URL$$"
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
