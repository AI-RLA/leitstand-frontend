services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: leitstand-frontend:local
    environment:
      # A bare origin; `backend` resolves on the shared network below.
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      NGINX_ENVSUBST_FILTER: "^BACKEND_URL$$"
    # Attached upstream by nginx; the browser never holds it.
    secrets:
      - leitstand_auth_bearer_token
    # Every interface by default: this port is the UI.
    ports:
      - "${FRONTEND_BIND_ADDR:-0.0.0.0}:${FRONTEND_HOST_PORT:-80}:80"
    # To replace the shipped map setup without a rebuild, mount a folder holding map.json. A folder
    # rather than the file, so edits show on reload.
    # volumes:
    #   - ./config.local:/usr/share/nginx/html/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# Created by the backend stack; nginx resolves `backend` per request, so start order is free.
networks:
  default:
    name: leitstand
    external: true

# The same file the backend reads; LEITSTAND_SECRETS_DIR when the checkouts are not side by side.
secrets:
  leitstand_auth_bearer_token:
    file: ${LEITSTAND_SECRETS_DIR:-../leitstand-backend/secrets}/leitstand_auth_bearer_token
